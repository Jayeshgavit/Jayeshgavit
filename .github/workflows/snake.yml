name: Generate contribution snake

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Jayeshgavit
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#16a96f&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39ff9c&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
