<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
<title id="title">Jayesh Gavit developer terminal</title>
<desc id="desc">Animated terminal introducing Jayesh Gavit, full-stack developer.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071711"/><stop offset=".55" stop-color="#0b111c"/><stop offset="1" stop-color="#10152b"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#3bff9f"/><stop offset=".55" stop-color="#33d6ff"/><stop offset="1" stop-color="#a685ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace }
    .reveal { animation: appear .55s both }
    .one { animation-delay: .3s } .two { animation-delay: 1.1s } .three { animation-delay: 1.9s }
    .cursor { animation: blink 1s steps(1) infinite }
    .pulse { animation: pulse 4s ease-in-out infinite }
    @keyframes appear { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes pulse { 50% { opacity: .55 } }
    @media (prefers-reduced-motion: reduce) { .reveal,.cursor,.pulse { animation: none } }
  </style>
</defs>
<rect width="960" height="300" rx="22" fill="url(#bg)"/>
<rect x="16" y="16" width="928" height="268" rx="15" fill="#090e16" fill-opacity=".82" stroke="#35475a"/>
<path d="M16 61H944" stroke="#35475a"/>
<circle cx="43" cy="39" r="6" fill="#ff5f57"/><circle cx="65" cy="39" r="6" fill="#febc2e"/><circle cx="87" cy="39" r="6" fill="#28c840"/>
<text x="480" y="44" fill="#8098a9" font-size="14" text-anchor="middle">jayesh@portfolio:~</text>
<circle class="pulse" cx="846" cy="196" r="69" fill="#26d9a0" opacity=".18" filter="url(#glow)"/>
<path d="M740 220 790 130 850 228 900 160" fill="none" stroke="url(#line)" stroke-width="2" opacity=".5"/>
<text class="reveal one" x="52" y="103" fill="#6beaa3" font-size="18">$ whoami</text>
<text class="reveal two" x="52" y="162" fill="#f0f6fc" font-size="43" font-weight="700">Jayesh Gavit</text>
<text class="reveal three" x="53" y="204" fill="#71ddff" font-size="20">Full-Stack Developer  /  Product Builder</text>
<text x="53" y="253" fill="#9caec0" font-size="15">React  ·  Next.js  ·  TypeScript  ·  Python  ·  PostgreSQL</text>
<rect class="cursor" x="688" y="240" width="9" height="16" fill="#57efb0"/>
</svg>